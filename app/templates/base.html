<!DOCTYPE html>
<html lang="id" class="h-full" style="color-scheme: dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1A1A20" />
  <title>{% block title %}SRE Triage Assistant{% endblock %}</title>

  <!-- Tailwind CSS via CDN (lihat ARCHITECTURE.md §2) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gcp: {
              canvas: '#1A1A20',
              surface: '#25252C',
              elevated: '#2E2E38',
              border: '#3A3A44',
              borderElev: '#444450',
              focus: '#8AB4F8',
              ink: '#E8EAED',
              inkSecondary: '#9AA0A6',
              inkMuted: '#6E6E78',
              blue: '#4285F4',
              blueLight: '#8AB4F8',
              success: '#0F9D58',
              warning: '#FBBC05',
              error: '#EA4335',
              sev1: { bg: '#3C1618', border: '#F28B82', text: '#F28B82' },
              sev2: { bg: '#3B2611', border: '#FDD663', text: '#FDD663' },
              sev3: { bg: '#172B4D', border: '#8AB4F8', text: '#8AB4F8' },
              sev4: { bg: '#282A2D', border: '#9AA0A6', text: '#9AA0A6' },
              pending: { bg: '#352A15', border: '#FBBF24', text: '#FBBF24' },
            }
          },
          fontFamily: {
            sans: ['Inter', 'Roboto', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            mono: ['JetBrains Mono', 'Roboto Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
          fontSize: {
            caption: ['10px', { lineHeight: '14px', letterSpacing: '0.05em' }],
            body: ['13px', { lineHeight: '1.5' }],
          },
          borderRadius: {
            md: '6px',
            sm: '4px',
          },
        },
      },
    }
  </script>

  <!-- HTMX via CDN (tanpa SRI integrity: hash dijaga agar tetap valid antar versi CDN) -->
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gcp-canvas: #1A1A20;
      --gcp-surface: #25252C;
      --gcp-elevated: #2E2E38;
      --gcp-border: #3A3A44;
      --gcp-border-elev: #444450;
      --gcp-focus: #8AB4F8;
      --gcp-ink: #E8EAED;
      --gcp-ink-secondary: #9AA0A6;
      --gcp-ink-muted: #6E6E78;
      --gcp-blue: #4285F4;
      --gcp-blue-light: #8AB4F8;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-feature-settings: 'rlig' 1, 'calt' 1;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #3A3A44; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4A4F58; }
    ::-webkit-scrollbar-track { background: transparent; }

    [x-cloak] { display: none !important; }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }

    *:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--gcp-focus);
      border-radius: 4px;
    }

    /* ===== Styling Markdown di dalam Chat Bubble ===== */
    .chat-markdown p { margin-bottom: 0.5rem; }
    .chat-markdown p:last-child { margin-bottom: 0; }
    .chat-markdown strong { color: #E8EAED; font-weight: 600; }
    .chat-markdown ul { list-style-type: disc; padding-left: 1.25rem; margin: 0.4rem 0 0.6rem; space-y: 0.25rem; }
    .chat-markdown ol { list-style-type: decimal; padding-left: 1.25rem; margin: 0.4rem 0 0.6rem; }
    .chat-markdown li { margin-bottom: 0.3rem; line-height: 1.55; }
    .chat-markdown code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background-color: #1A1A20;
      border: 1px solid #3A3A44;
      color: #8AB4F8;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }
    .chat-markdown pre {
      background-color: #1A1A20;
      border: 1px solid #3A3A44;
      padding: 0.6rem 0.75rem;
      border-radius: 4px;
      overflow-x: auto;
      margin: 0.5rem 0;
    }
    .chat-markdown pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #E8EAED;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* Spinner ala Google (bulat berputar) */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-loading .btn-label { opacity: 0.85; }
</style>
  {% block head %}{% endblock %}

</head>

<!-- CSRF token ditempel pada SEMUA request HTMX via hx-headers (AGENTS.md §3.3) -->
<body class="h-full bg-gcp-canvas text-gcp-ink antialiased selection:bg-gcp-blue-light selection:blue"
      hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'
      hx-indicator='#global-htmx-indicator'>

  <!-- Skip link ke konten utama -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-gcp-blue focus:text-white focus:rounded-sm">Lompat ke konten utama</a>

  <div class="h-full flex flex-col overflow-hidden">
    <!-- ===== Top Utility Bar (fixed 48px) ===== -->
    <header class="h-12 border-b border-gcp-border bg-gcp-surface flex items-center justify-between px-4 shrink-0 z-20 flex-shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex h-6 w-6 items-center justify-center rounded-sm bg-gcp-elevated border border-gcp-border text-gcp-blue-light">
          <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 3l7 4v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V7l7-4z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 9v4m0 3h.01" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm font-semibold text-gcp-ink tracking-tight">SRE Incident Triage</h1>
        </div>
      </div>
    </header>

    <!-- ===== Main Shell ===== -->
    <div class="flex-1 flex overflow-hidden relative">

      <!-- ===== Left Navigation Rail (GCP Console Sidebar) ===== -->
<!-- ===== Left Navigation Rail (Expand on Hover) ===== -->
      <div class="w-14 shrink-0 relative z-30">
        <nav id="nav-rail"
             aria-label="Navigasi Utama"
             class="group absolute inset-y-0 left-0 w-14 hover:w-44 border-r border-gcp-border bg-gcp-surface flex flex-col transition-all duration-200 ease-out overflow-hidden hover:shadow-2xl hover:shadow-black/60">
          <div class="flex flex-col gap-1.5 p-2 h-full">

            <!-- Kategori 1: Triage & History -->
            <a href="{{ url_for('triage.index') }}"
               class="flex items-center gap-3 px-2.5 py-2 rounded-sm transition-colors whitespace-nowrap {% if request.endpoint == 'triage.index' %}bg-gcp-blue-light/10 text-gcp-blue-light border border-gcp-blue-light/20{% else %}text-gcp-ink-secondary hover:bg-gcp-elevated hover:text-gcp-ink{% endif %}"
               title="Triage">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="text-xs font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-150">Triage</span>
            </a>

            <a href="{{ url_for('triage.history') }}"
               class="flex items-center gap-3 px-2.5 py-2 rounded-sm transition-colors whitespace-nowrap text-gcp-ink-secondary hover:bg-gcp-elevated hover:text-gcp-ink"
               title="History">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="text-xs font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-150">History</span>
            </a>

            <!-- Divider -->
            <div class="my-1 border-t border-gcp-border" role="separator"></div>

            <!-- Kategori 2: Runbook -->
            <a href="{{ url_for('runbook.index') }}"
               class="flex items-center gap-3 px-2.5 py-2 rounded-sm transition-colors whitespace-nowrap text-gcp-ink-secondary hover:bg-gcp-elevated hover:text-gcp-ink"
               title="Runbook">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="text-xs font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-150">Runbook</span>
            </a>

            <!-- Divider -->
            <div class="my-1 border-t border-gcp-border" role="separator"></div>

            <!-- Kategori 3: Dashboard -->
            <a href="{{ url_for('analytics.dashboard') }}"
               class="flex items-center gap-3 px-2.5 py-2 rounded-sm transition-colors whitespace-nowrap {% if request.endpoint and request.endpoint.startswith('analytics') %}bg-gcp-blue-light/10 text-gcp-blue-light border border-gcp-blue-light/20{% else %}text-gcp-ink-secondary hover:bg-gcp-elevated hover:text-gcp-ink{% endif %}"
               title="Dashboard">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="text-xs font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-150">Dashboard</span>
            </a>

          </div>
        </nav>
      </div>
      <!-- ===== Page Content Area ===== -->
      <div class="flex-1 flex flex-col overflow-hidden relative min-w-0">

        <!-- Sub-Header Contextual Toolbar -->
        <header class="h-12 border-b border-gcp-border bg-gcp-surface/80 backdrop-blur flex items-center justify-between px-4 shrink-0 z-10 flex-shrink-0">
          <div class="flex items-center gap-3 min-w-0">
            <h2 class="text-sm font-medium text-gcp-ink">{% block page_title %}Console{% endblock %}</h2>
            <p class="text-[10px] text-gcp-ink-muted font-mono">{% block page_subtitle %}{% endblock %}</p>
          </div>
          <div class="flex items-center gap-2">
            {% block toolbar %}{% endblock %}
          </div>
        </header>

        <!-- Global HTMX indicator (determinate progress bar selama request) -->
        <div id="global-htmx-indicator" class="htmx-indicator absolute top-0 left-0 right-0 h-[3px] bg-gcp-blue-light w-0 opacity-0 transition-all duration-300 z-40"></div>

        <!-- Scrollable Content -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 min-w-0">
          {% block content %}{% endblock %}
        </main>

      </div>
    </div>
  </div>

  {% block scripts %}{% endblock %}

  <script>
    // ===== Global HTMX determinate progress bar =====
    const bar = document.getElementById('global-htmx-indicator');
    let progressTimer = null;
    let progress = 0;

    function nudgeProgress() {
      if (!bar) return;
      if (progress < 75) {
        progress += Math.random() * 12 + 3; // naik perlahan ke 75%
        bar.style.width = Math.min(progress, 75) + '%';
        bar.style.opacity = 1;
        progressTimer = setTimeout(nudgeProgress, 350);
      }
    }

    document.body.addEventListener('htmx:beforeRequest', () => {
      if (progressTimer) clearTimeout(progressTimer);
      progress = 0;
      bar.style.width = '0%';
      bar.style.opacity = 1;
      nudgeProgress();
    });

    document.body.addEventListener('htmx:afterRequest', () => {
      if (progressTimer) clearTimeout(progressTimer);
      progress = 100;
      bar.style.width = '100%';
      setTimeout(() => { bar.style.opacity = 0; bar.style.width = '0%'; progress = 0; }, 400);
    });
  </script>
</body>
</html>
