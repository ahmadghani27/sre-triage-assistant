{# Pesan error inline untuk kegagalan validasi ringan (bukan HTTP 500).
   Dikirim oleh blueprint dengan header HX-Retarget agar sesuai konteks. #}
<div class="flex items-start gap-3 rounded-md border border-gcp-border border-l-4 border-l-[#EA4335] bg-gcp-surface px-3.5 py-3">
  <span class="inline-flex h-5 w-5 mt-0.5 shrink-0 items-center justify-center rounded-sm bg-[#EA4335] text-white">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path d="M12 8v5m0 3h.01" stroke-linecap="round"/>
    </svg>
  </span>
  <div>
    <p class="text-xs font-semibold text-gcp-ink">Input tidak valid</p>
    <p class="text-[11px] text-gcp-ink-secondary mt-0.5 leading-relaxed">{{ message }}</p>
  </div>
</div>
