{# Satu bubble chat; user (kanan) atau assistant (kiri). Dikirim sebagai
   *body partial* dan di-append ke #chat-messages oleh POST /chat. #}
{% if role == 'user' %}
<div class="flex justify-end">
  <div class="max-w-[82%] rounded-md rounded-tr-sm border border-[#4285F4] bg-[#172B4D] px-3.5 py-2.5">
    <p class="text-[12.5px] leading-relaxed text-white whitespace-pre-wrap">{{ text }}</p>
    <p class="mt-1 text-[9px] font-semibold uppercase tracking-wider text-[#8AB4F8] text-right">You</p>
  </div>
</div>
{% else %}
<div class="flex justify-start">
  <div class="max-w-[94%] rounded-md rounded-tl-sm border border-gcp-border-elev bg-gcp-elevated px-4 py-3">
    <!-- Header Assistant -->
    <div class="flex items-center justify-between gap-2 pb-2 mb-2.5 border-b border-gcp-border">
      <div class="flex items-center gap-2">
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-sm bg-[#34A853] text-white">
          <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="text-[10px] font-semibold uppercase tracking-wider text-gcp-ink">Strict-RAG Assistant</span>
      </div>
      <span class="px-1.5 py-0.5 rounded-sm bg-gcp-canvas border border-gcp-border text-[9px] font-mono text-gcp-ink-secondary">Grounded</span>
    </div>

    <!-- Konten Jawaban (Dirender dari Markdown ke HTML rapi via global htmx:afterSwap listener di base.html) -->
    <div class="chat-markdown text-[12.5px] leading-relaxed text-gcp-ink">
      <script type="text/plain" class="raw-md-source">{{ text }}</script>
    </div>
  </div>
</div>
{% endif %}
